        // 解析企业数据
        function parseEnterpriseData() {
            const items = jsonData[0].data.items;
            return items
                .filter(item => item.fields && Object.keys(item.fields).length > 0 && item.fields['状态'] === '发布')
                .map((item, index) => {
                    const fields = item.fields;
                    const getText = (field) => field && field[0] ? field[0].text : '';
                    
                    // 提取地区（省份）
                    const address = getText(fields['企业地址']);
                    const region = address.match(/^([\u4e00-\u9fa5]+省|[\u4e00-\u9fa5]+市)/)?.[0] || '其他';
                    
                    return {
                        id: index + 1,
                        record_id: item.record_id,
                        name: getText(fields['企业名称']),
                        address: address,
                        region: region,
                        supply_chain: getText(fields['企业供应链信息']),
                        employees: fields['员工数量'] || 0,
                        weekly_hours: fields['周工作时长（小时）'] || 0,
                        details: getText(fields['企业用工情况详情']),
                        complaints: getText(fields['企业吐槽']),
                        views: Math.floor(Math.random() * 3000) + 500, // 随机浏览量
                        date: fields['日期'],
                        approved: true
                    };
                });
        }

                option.textContent = province;
                provinceSelectEl.appendChild(option);
            });

        // 渲染企业列表

            }
            
            enterprisesToRender.forEach(enterprise => {

                                 'bg-red-100 text-red-700';
                
                const enterpriseEl = document.createElement('div');
                enterpriseEl.className = 'p-4 hover:bg-gray-50 transition-smooth cursor-pointer';
                enterpriseEl.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between">
                        <div>
                            <h3 class="font-semibold text-lg mb-1">${enterprise.name}</h3>
                            <div class="flex flex-wrap gap-2 text-sm text-gray-600">

                            </div>
                        </div>
                        <div class="mt-3 md:mt-0 flex items-center gap-4">
                            <span class="px-3 py-1 rounded-full text-sm font-medium ${hoursClass}">
                                ${enterprise.weekly_hours}小时/周
                            </span>

                            </button>
                        </div>
                    </div>
                `;
                
                enterpriseEl.addEventListener('click', () => showEnterpriseDetails(enterprise));
                enterpriseListEl.appendChild(enterpriseEl);
            });

        // 渲染热门企业
        function renderTopEnterprises() {
            const topEnterprises = [...enterprises]

                        <p class="text-xs text-gray-500">浏览: ${enterprise.views}</p>
                    </div>

                topEl.addEventListener('click', () => showEnterpriseDetails(enterprise));
                topEnterprisesEl.appendChild(topEl);
            });
        }

            }, {});
            
            const regions = Object.entries(regionDistribution)
                .sort((a, b) => b[1] - a[1]);
            
            regionDistributionEl.innerHTML = '';
            
            regions.forEach(([region, count]) => {
                const percentage = Math.round((count / enterprises.length) * 100);
                
                const regionEl = document.createElement('div');
                regionEl.className = 'mb-3';
                regionEl.innerHTML = `
                    <div class="flex justify-between text-sm mb-1">
                        <span>${region}</span>
                        <span class="text-gray-500">${count}家</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="bg-primary h-2 rounded-full" style="width: ${percentage}%"></div>
                    </div>
                `;
                
                regionDistributionEl.appendChild(regionEl);
            });
        }

        // 渲染工作时长排名
        function renderWorkHoursRanking() {
            const sortedEnterprises = [...enterprises]
                .sort((a, b) => a.weekly_hours - b.weekly_hours)
                .slice(0, 5);
            
            workHoursRankingEl.innerHTML = '';
            
            sortedEnterprises.forEach(enterprise => {
                const hoursClass = enterprise.weekly_hours <= 40 ? 'text-green-600' : 
                                 enterprise.weekly_hours <= 45 ? 'text-yellow-600' : 
                                 'text-red-600';
                
                const hourEl = document.createElement('div');
                hourEl.className = 'py-2 border-b border-gray-100 last:border-0 hover:bg-gray-50 p-1 rounded transition-smooth cursor-pointer';
                hourEl.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-sm">${enterprise.name}</span>
                        <span class="font-semibold ${hoursClass}">${enterprise.weekly_hours}小时</span>
                    </div>
                `;
                
                hourEl.addEventListener('click', () => showEnterpriseDetails(enterprise));
                workHoursRankingEl.appendChild(hourEl);
            });
        }

        // 显示企业详情 - 小红书风格卡片
        function showEnterpriseDetails(enterprise) {
            // 更新浏览量
            enterprises = enterprises.map(e => 
                e.id === enterprise.id ? { ...e, views: e.views + 1 } : e
            );
            enterprise = { ...enterprise, views: enterprise.views + 1 };
            
            // 更新统计数据
            updateStats();
            renderTopEnterprises();
            
            // 设置模态框内容
            modalTitleEl.textContent = enterprise.name;
            
            const hoursClass = enterprise.weekly_hours <= 40 ? 'bg-green-100 text-green-700' : 
                             enterprise.weekly_hours <= 45 ? 'bg-yellow-100 text-yellow-700' : 
                             'bg-red-100 text-red-700';
            
            // 小红书风格的卡片内容布局
            modalContentEl.innerHTML = `
                <!-- 企业基本信息标签 -->
                <div class="flex flex-wrap gap-2 mb-4">
                    <span class="px-3 py-1 rounded-full text-sm font-medium ${hoursClass}">
                        ${enterprise.weekly_hours}小时/周
                    </span>
                    <span class="px-3 py-1 bg-white/70 rounded-full text-sm text-gray-700">
                        <i class="fa fa-users mr-1"></i> ${enterprise.employees.toLocaleString()}人
                    </span>
                    <span class="px-3 py-1 bg-white/70 rounded-full text-sm text-gray-700">
                        <i class="fa fa-map-marker mr-1"></i> ${enterprise.region}
                    </span>
                    <span class="px-3 py-1 bg-white/70 rounded-full text-sm text-gray-700">
                        <i class="fa fa-eye mr-1"></i> 浏览: ${enterprise.views}
                    </span>
                </div>
                
                <!-- 企业信息卡片 -->
                <div class="space-y-4">
                    <!-- 企业地址 -->
                    <div class="bg-white/80 p-4 rounded-xl">
                        <h3 class="text-sm font-semibold text-gray-500 mb-2 flex items-center">
                            <i class="fa fa-map-marker text-primary mr-2"></i>企业地址
                        </h3>
                        <p class="text-gray-700">${enterprise.address}</p>
                    </div>
                    
                    <!-- 供应链信息 -->
                    <div class="bg-white/80 p-4 rounded-xl">
                        <h3 class="text-sm font-semibold text-gray-500 mb-2 flex items-center">
                            <i class="fa fa-industry text-primary mr-2"></i>供应链信息
                        </h3>
                        <p class="text-gray-700">${enterprise.supply_chain}</p>
                    </div>
                    
                    <!-- 用工情况详情 -->
                    <div class="bg-white/80 p-4 rounded-xl">
                        <h3 class="text-sm font-semibold text-gray-500 mb-2 flex items-center">
                            <i class="fa fa-clock-o text-primary mr-2"></i>用工情况详情
                        </h3>
                        <p class="text-gray-700">${enterprise.details}</p>
                    </div>
                    
                    <!-- 员工评价 -->
                    <div class="bg-white/80 p-4 rounded-xl">
                        <h3 class="text-sm font-semibold text-gray-500 mb-2 flex items-center">
                            <i class="fa fa-comment text-primary mr-2"></i>员工评价
                        </h3>
                        <div class="flex items-start">
                            <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary mr-3 mt-1 flex-shrink-0">
                                <i class="fa fa-user"></i>
                            </div>
                            <p class="text-gray-700">${enterprise.complaints}</p>
                        </div>
                    </div>
                </div>
            `;
            
            // 显示模态框并添加动画效果
            enterpriseModalEl.classList.remove('hidden');
            enterpriseModalEl.classList.add('flex');
            // 触发重排后添加动画类
            setTimeout(() => {
                modalCardEl.classList.remove('scale-95', 'opacity-0');
                modalCardEl.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        // 关闭模态框
        function closeModal() {
            // 添加退出动画
            modalCardEl.classList.remove('scale-100', 'opacity-100');
            modalCardEl.classList.add('scale-95', 'opacity-0');
            
            // 动画结束后隐藏
            setTimeout(() => {
                enterpriseModalEl.classList.add('hidden');
                enterpriseModalEl.classList.remove('flex');
            }, 300);
        }

        // 搜索企业（支持省份筛选+关键词搜索）
        function searchEnterprises() {
            const searchTerm = searchInputEl.value.toLowerCase().trim();
            const selectedProvince = provinceSelectEl.value;
            
            let filtered = enterprises;
            
            // 省份筛选
            if (selectedProvince) {
                filtered = filtered.filter(e => e.region === selectedProvince);
            }
            
            // 关键词搜索
            if (searchTerm) {
                filtered = filtered.filter(e => 
                    e.name.toLowerCase().includes(searchTerm) ||
                    e.supply_chain.toLowerCase().includes(searchTerm)
                );
            }
            
            renderEnterpriseList(filtered);
        }

        // 更新统计数据
        function updateStats() {
            totalEnterprisesEl.textContent = enterprises.length;
            
            const totalViews = enterprises.reduce((sum, e) => sum + e.views, 0);
            totalViewsEl.textContent = totalViews.toLocaleString();
            
            const regionCount = new Set(enterprises.map(e => e.region)).size;
            regionCountEl.textContent = regionCount;
        }

        // 事件监听
        closeModalBtn.addEventListener('click', closeModal);
        enterpriseModalEl.addEventListener('click', (e) => {
            if (e.target === enterpriseModalEl) {
                closeModal();
            }
        });
        
        searchBtnEl.addEventListener('click', searchEnterprises);
        searchInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchEnterprises();
            }
        });
        
        provinceSelectEl.addEventListener('change', searchEnterprises);

        // 初始化页面
        function init() {
            populateProvinceSelect();
            renderEnterpriseList(enterprises);
            renderTopEnterprises();
            renderRegionDistribution();
            renderWorkHoursRanking();
            updateStats();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
